<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestão de Chamados</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <h1>Gestão de Chamados</h1>
  <p class="sub"></p>

  <nav class="tabs">
    <button class="tab active" data-tela="adicionar">Adicionar chamado</button>
    <button class="tab" data-tela="gestao">Gestão de chamados</button>
  </nav>

  <section id="tela-adicionar" class="tela active">
    <div class="painel">
      <label>Chamado
        <input type="text" id="numero" placeholder="Número do chamado. Ex: 123456" autocomplete="off">
      </label>
      <label>Loja
        <input type="text" id="loja" placeholder="Ex: Loja 014 - Moema" autocomplete="off">
      </label>
      <label>Data de inclusão
        <input type="date" id="data">
      </label>
      <label>Status
        <select id="status"></select>
      </label>
      <button id="btn-salvar" class="primario">Adicionar chamado</button>
      <p id="msg" class="msg"></p>
    </div>
  </section>

  <section id="tela-gestao" class="tela">
    <div class="legenda">
      <span><i class="bola amarelo"></i>Mais de 3 dias</span>
      <span><i class="bola laranja"></i>Mais de 7 dias</span>
      <span><i class="bola vermelho"></i>Mais de 10 dias</span>
      <span class="nota"></span>
    </div>
    <div class="filtros">
      <select id="filtro-status"></select>
      <input type="text" id="filtro-loja" placeholder="Filtrar por loja...">
    </div>
    <div id="lista"></div>
  </section>
</div>
<div id="modal" class="modal" hidden>
  <div class="modal-box">
    <p id="modal-txt"></p>
    <div class="modal-acoes">
      <button id="modal-nao" class="btn-x">Cancelar</button>
      <button id="modal-sim" class="primario">Confirmar</button>
    </div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
